services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:backend"
    ports:
      - "4000:4000"
    env_file:
      - apps/backend/.env.example
    environment:
      MONGODB_URI: mongodb://mongo:27017/vedaai
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
    volumes:
      - .:/app
    depends_on:
      - mongo
      - redis

  worker:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run worker --workspace @vedaai/backend"
    env_file:
      - apps/backend/.env.example
    environment:
      MONGODB_URI: mongodb://mongo:27017/vedaai
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
    depends_on:
      - mongo
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:frontend"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  mongo-data:
